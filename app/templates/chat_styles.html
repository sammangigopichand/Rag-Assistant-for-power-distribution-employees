    /* =========================================
   FIXED SIDEBAR + SCROLLABLE CONTENT
   ========================================= */

    html,
    body {
        height: 100%;
        margin: 0;
        overflow: hidden;
    }

    .app-shell.chat-shell {
        height: 100vh;
        overflow: hidden;
    }

    /* Left sidebar stays in place */
    .sidebar {
        height: 100vh;
        overflow-y: auto;
        flex-shrink: 0;
    }

    /* Right side occupies remaining screen */
    .workspace {
        height: 100vh;
        overflow: hidden;
