<style>
    :root {
        --ink: #18343c;
        --muted: #62767b;
        --teal: #087f72;
        --line: #dce6e4;
        --paper: #f4f7f6;
        --navy: #122d36
    }

    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.6
    }

    a {
        color: var(--teal);
        text-underline-offset: 4px
    }

    button,
    input {
        font: inherit
    }

    button {
        cursor: pointer
    }

    a:focus-visible,
    button:focus-visible {
        outline: 3px solid #32b7a0;
        outline-offset: 5px
    }

    h1,
    h2,
    h3,
    p {
        margin-top: 0
    }

    h1,
    h2,
    h3 {
        line-height: 1.2;
        letter-spacing: -.035em
    }

    h1 {
        font-size: clamp(30px, 3.5vw, 46px);
        font-weight: 650
    }

    h2 {
        font-size: 25px
    }

    h3 {
        font-size: 17px
    }

    p {
        color: var(--muted)
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: inherit;
        text-decoration: none;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -.5px
    }

    .brand small {
        display: block;
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 500;
        opacity: .65
    }

    .brand-mark {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 42px;
        height: 46px;
        border-radius: 13px;
        background: #c6f36b;
        color: var(--navy);
        font-size: 29px
    }

    .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--teal);
        margin-bottom: 18px
    }

    .auth-layout {
        min-height: 100svh;
        display: grid;
        grid-template-columns: 1fr 1fr
    }

    .auth-story {
        background: var(--navy);
        color: white;
        padding: 48px clamp(32px, 6vw, 100px);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden
    }

    .story-content {
        margin: auto 0;
        padding: 65px 0 40px;
        max-width: 480px;
        position: relative;
        z-index: 1
    }

    .story-content h1 {
        font-size: clamp(38px, 4.5vw, 64px);
        line-height: 1.08;
        margin-bottom: 25px
    }

    .story-content h1 span {
        color: #c6f36b
    }

    .story-content p {
        color: #b5c9cb;
        max-width: 370px;
        font-size: 16px
    }

    .auth-story .eyebrow {
        color: #a9d7cb
    }

    .story-lines {
        display: flex;
        align-items: end;
        gap: 16px;
        height: 120px;
        margin: 35px 0
    }

    .story-lines span {
        flex: 1;
        border: 1px solid #456069;
        border-bottom: 3px solid #9bc86a;
        border-radius: 8px 8px 0 0;
        background: linear-gradient(180deg, #294951, transparent);
        height: 55%
    }

    .story-lines span:nth-child(2) {
        height: 80%
    }

    .story-lines span:nth-child(3) {
        height: 65%
    }

    .story-lines span:nth-child(4) {
        height: 100%;
        background: linear-gradient(180deg, #466449, transparent)
    }

    .story-lines span:nth-child(5) {
        height: 85%
    }

    .story-footer {
        font-size: 12px;
        color: #b5c9cb
    }

    .auth-main {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 28px;
        background: #fafcfb
    }

    .auth-card {
        width: 100%;
        max-width: 390px
    }

    .auth-card h2 {
        font-size: 32px;
        margin-bottom: 10px
    }

    .auth-card>p {
        margin-bottom: 32px
    }

    .field {
        margin-bottom: 20px
    }

    .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px
    }

    input {
        width: 100%;
        min-height: 50px;
        padding: 12px 15px;
        border: 1px solid #cedbd7;
        background: white;
        color: var(--ink);
        border-radius: 9px;
        outline: none;
        transition: border-color .2s, box-shadow .2s
    }

    input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px #087f7219
    }

    input::placeholder {
        color: #788984
    }

    .password-wrap {
        position: relative
    }

    .password-wrap input {
        padding-right: 66px
    }

    .password-toggle {
        position: absolute;
        right: 8px;
        top: 3px;
        min-height: 44px;
        min-width: 44px;
        border: 0;
        background: transparent;
        color: var(--teal);
        font-size: 12px;
        padding: 6px
    }

    .primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--teal);
        color: white;
        border: 0;
        border-radius: 9px;
        padding: 13px 22px;
        font-weight: 600;
        width: 100%;
        transition: background .2s, transform .2s
    }

    .primary:hover {
        background: #06695e;
        transform: translateY(-1px)
    }

    button:disabled {
        cursor: wait;
        opacity: .65
    }

    .auth-switch {
        text-align: center;
        font-size: 13px;
        margin: 24px 0
    }

    .auth-switch a {
        font-weight: 600
    }

    .form-note {
        font-size: 12px;
        text-align: center;
        border-top: 1px solid var(--line);
        padding-top: 22px;
        margin-top: 32px
    }

    .message:empty {
        display: none
    }

    .message {
        font-size: 13px;
        border-radius: 8px;
        padding: 12px 14px;
        background: #fff0ed;
        color: #a23827;
        margin: 16px 0
    }

    .message.success {
        background: #e5f5ee;
        color: #176649
    }

    .app-shell {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        min-height: 100svh
    }

    .sidebar {
        background: var(--navy);
        color: #eaf1f0;
        padding: 32px 24px;
        display: flex;
        flex-direction: column
    }

    .sidebar .brand {
        margin-bottom: 55px
    }

    .nav-label {
        font-size: 10px;
        letter-spacing: 2px;
        color: #9eb6bb;
        margin: 0 12px 14px
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 15px;
        border-radius: 8px;
        text-decoration: none;
        color: #b9cdcf;
        font-size: 14px;
        margin-bottom: 8px
    }

    .nav-item:hover {
        background: #203f47
    }

    .nav-item.active {
        background: #28454c;
        color: #d6f6b7
    }

    .sidebar-bottom {
        margin-top: auto;
        padding-top: 60px
    }

    .sidebar-note {
        border: 1px solid #36505a;
        border-radius: 12px;
        padding: 18px;
        font-size: 12px;
        color: #abc2c4;
        margin-bottom: 26px
    }

    .sidebar-note strong {
        display: block;
        color: #e6f3ef;
        margin-bottom: 6px
    }

    .workspace {
        min-width: 0
    }

    .topbar {
        height: 88px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 45px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        gap: 20px
    }

    .breadcrumb {
        font-size: 13px;
        color: var(--muted)
    }

    .breadcrumb span {
        color: var(--ink);
        margin-left: 12px
    }

    .profile {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0
    }

    .avatar {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #e9efdf;
        color: #476232;
        font-weight: 700
    }

    .profile-name {
        font-size: 13px;
        font-weight: 600;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap
    }

    .profile small {
        display: block;
        font-size: 10px;
        color: var(--muted)
    }

    .main-content {
        max-width: 1250px;
        margin: auto;
        padding: 44px 45px
    }

    .welcome {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px
    }

    .welcome h1 {
        font-size: 32px;
        margin-bottom: 10px;
        overflow-wrap: anywhere
    }

    .welcome p {
        margin: 0;
        font-size: 14px
    }

    .tag {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        background: #fff;
        padding: 6px 11px;
        border-radius: 20px;
        font-size: 11px;
        white-space: nowrap;
        color: var(--muted)
    }

    .dot {
        height: 6px;
        width: 6px;
        border-radius: 50%;
        background: var(--teal)
    }

    .hero {
        position: relative;
        overflow: hidden;
        border-radius: 17px;
        background: var(--navy);
        padding: 35px 38px;
        color: #fff;
        margin-bottom: 32px
    }

    .hero .eyebrow {
        color: #c6f36b
    }

    .hero h2 {
        font-size: clamp(27px, 3vw, 37px);
        max-width: 540px;
        margin-bottom: 16px
    }

    .hero p {
        color: #bcd0d0;
        max-width: 530px;
        font-size: 14px
    }

    .hero .tag {
        background: #29454b;
        border-color: #466166;
        color: #dce8e6
    }

    .hero-decoration {
        position: absolute;
        right: -60px;
        top: -70px;
        width: 290px;
        height: 290px;
        border: 1px solid #63837e55;
        border-radius: 50%;
        pointer-events: none
    }

    .hero-decoration:before,
    .hero-decoration:after {
        content: "";
        position: absolute;
        inset: 35px;
        border: 1px solid #63837e55;
        border-radius: 50%
    }

    .hero-decoration:after {
        inset: 70px
    }

    .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 15px;
        margin-bottom: 18px
    }

    .section-heading h2 {
        font-size: 20px;
        margin: 0
    }

    .section-heading span {
        font-size: 12px;
        color: var(--muted)
    }

    .topic-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-bottom: 30px
    }

    .topic-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px
    }

    .topic-icon {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 11px;
        background: #e7f3ed;
        color: var(--teal);
        font-size: 23px;
        margin-bottom: 24px
    }

    .topic-card:nth-child(2) .topic-icon {
        background: #eef0fa;
        color: #6771a5
    }

    .topic-card:nth-child(3) .topic-icon {
        background: #faf0df;
        color: #a47830
    }

    .topic-card h3 {
        margin-bottom: 9px
    }

    .topic-card p {
        font-size: 13px;
        margin-bottom: 0
    }

    .assistant-panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 26px;
        display: flex;
        align-items: center;
        gap: 24px
    }

    .assistant-panel h3 {
        margin-bottom: 8px
    }

    .assistant-panel p {
        font-size: 13px;
        margin: 0;
        max-width: 660px
    }

    .assistant-panel .tag {
        margin-left: auto;
        background: #f5f7f6
    }

    .page-footer {
        font-size: 11px;
        color: var(--muted);
        margin-top: 32px;
        display: flex;
        justify-content: space-between;
        gap: 15px
    }

    @media(min-width:1500px) {
        .auth-story {
            padding-left: 12vw
        }

        .auth-main {
            padding-right: 8vw
        }
    }

    @media(max-width:1000px) {
        .app-shell {
            grid-template-columns: 200px minmax(0, 1fr)
        }

        .sidebar {
            padding: 28px 16px
        }

        .main-content {
            padding: 30px 24px
        }

        .topbar {
            padding: 0 24px
        }

        .topic-grid {
            gap: 12px
        }

        .topic-card {
            padding: 18px
        }

        .welcome {
            align-items: flex-start
        }

        .welcome>.tag {
            display: none
        }
    }

    @media(max-width:720px) {
        .auth-layout {
            grid-template-columns: 1fr
        }

        .auth-story {
            padding: 25px
        }

        .story-content {
            padding: 35px 0 10px;
            max-width: none
        }

        .story-content h1 {
            font-size: 38px
        }

        .story-content p,
        .story-lines,
        .story-footer {
            display: none
        }

        .auth-main {
            padding: 35px 25px
        }

        .app-shell {
            grid-template-columns: 1fr
        }

        .sidebar {
            padding: 18px 22px;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 16px
        }

        .sidebar .brand {
            margin: 0
        }

        .sidebar nav,
        .sidebar-note,
        .sidebar .nav-label {
            display: none
        }

        .sidebar-bottom {
            margin: 0;
            padding: 0
        }

        .sidebar-bottom .nav-item {
            margin: 0;
            padding: 8px
        }

        .topbar {
            height: 70px;
            padding: 0 22px
        }

        .main-content {
            padding: 30px 22px
        }

        .welcome h1 {
            font-size: 27px
        }

        .hero {
            padding: 28px 25px
        }

        .hero-decoration {
            opacity: .4
        }

        .topic-grid {
            grid-template-columns: 1fr
        }

        .topic-card {
            display: grid;
            grid-template-columns: 42px 1fr;
            column-gap: 16px
        }

        .topic-icon {
            grid-row: span 2;
            margin: 0
        }

        .topic-card h3 {
            margin: 0 0 5px
        }

        .assistant-panel {
            align-items: flex-start;
            flex-direction: column;
            gap: 16px
        }

        .assistant-panel .tag {
            margin: 0
        }

        .page-footer {
            flex-direction: column;
            gap: 4px
        }

        .profile-name {
            max-width: 120px
        }

        .breadcrumb {
            font-size: 12px
        }
    }

    @media(prefers-reduced-motion:reduce) {
        * {
            transition: none !important;
            scroll-behavior: auto !important
        }
    }
</style>
